<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCMSKC Blogs</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/themify-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/custom-theme.css">
    <style>
        :root {
            --primary-color: #7f1f2c;
            --primary-gradient: linear-gradient(135deg, #7f1f2c 0%, #faf0e7 100%);
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 0;
        }

        .blog-hero {
            background: var(--primary-gradient);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .blog-hero h1 {
            margin: 0;
            font-size: 2.5rem;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .blog-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }

        .blog-table th,
        .blog-table td {
            padding: 18px 16px;
            border-bottom: 1px solid #e9ecef;
            vertical-align: top;
        }

        .blog-table th {
            background: #007bff;
            color: #fff;
            text-align: left;
            font-weight: 600;
        }

        .blog-table tr:last-child td {
            border-bottom: none;
        }

        .blog-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 6px;
        }

        .blog-date {
            display: block;
            font-size: 0.95rem;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .blog-short {
            color: #4b5563;
            line-height: 1.7;
            margin-bottom: 0;
        }

        .blog-thumbnail {
            width: 120px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #dee2e6;
        }

        .blog-title-cell {
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }

        .blog-title-cell div {
            max-width: calc(100% - 140px);
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background: #0056b3;
        }

        @media (max-width: 768px) {
            .blog-table th,
            .blog-table td {
                padding: 14px 12px;
            }

            .blog-title-cell {
                flex-direction: column;
            }

            .blog-thumbnail {
                width: 100%;
                height: 180px;
            }
        }
    </style>
</head>

<body>
    <!--::header part start::-->
    <header class="main_menu home_menu">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-12">
                    <nav class="navbar navbar-expand-lg navbar-light">
                        <a class="navbar-brand" href="index.html">
                            <img src="img/logo.png" alt="Rotaract Club logo" class="navbar-logo">
                        </a>
                        <button class="navbar-toggler" type="button" data-toggle="collapse"
                            data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                            aria-expanded="false" aria-label="Toggle navigation">
                            <span class="ti-menu"></span>
                        </button>
                        <div class="collapse navbar-collapse main-menu-item justify-content-end"
                            id="navbarSupportedContent">
                            <ul class="navbar-nav align-items-center">
                                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                                <li class="nav-item"><a class="nav-link" href="team.html">Team</a></li>
                                <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
                                <li class="nav-item dropdown">
                                    <a class="nav-link dropdown-toggle" href="#" role="button" data-toggle="dropdown"
                                       aria-expanded="false">More</a>
                                    <ul class="dropdown-menu">
                                        <li><a class="dropdown-item" href="history_of_club/previous_team.html">RCMSKC Journey</a></li>
                                        <li><a class="dropdown-item" href="contact.html">Contact</a></li>
                                        <li><a class="dropdown-item" href="all_org_theme.html">Themes</a></li>
                                        <li><a class="dropdown-item" href="blogs.html">Blogs</a></li>
                                        <li><a class="dropdown-item" href="upcoming_events.html">Upcoming Events</a></li>
                                        <li><a class="dropdown-item" href="testimonial.html">Testimonials</a></li>
                                    </ul>
                                </li>
                            </ul>
                        </div>
                    </nav>
                </div>
            </div>
        </div>
    </header>
    <!-- Header part end-->

    <div class="blog-hero">
        <h1>RCMSKC Blogs</h1>
    </div>

    <div class="container">
        <div class="table-responsive">
            <table class="blog-table" id="blogs-table">
                <thead>
                    <tr>
                        <th>Blog</th>
                        <th>Date</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="js/jquery-1.12.1.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>

    <script>
        const blogs = [
            {
                title: "Suno - Sound Unlocked for Needy One",
                date: "26th January",
                shortDescription: "A summary of our CSR initiative to provide hearing aids to the community.",
                images: ["https://via.placeholder.com/300x150"],
                url: "blogs/hearing-aid-donation.html"
            },
            {
                title: "Rakhi Celebration with Firefighters",
                date: "August 9, 2025",
                shortDescription: "Celebrating rakhi with firefighters",
                images: ["https://via.placeholder.com/300x150"],
                url: "blogs/world-tourism-day.html"
            },
            {
                title: "Pragati - The Modernization of School",
                date: "March 10, 2023",
                shortDescription: "Modernization of Pragati school, Dahanu School",
                images: ["https://via.placeholder.com/300x150"],
                url: "blogs/clean-up-drive.html"
            }
        ];

        const tableBody = document.querySelector("#blogs-table tbody");

        function displayBlogs() {
            blogs.forEach(blog => {
                const row = document.createElement("tr");

                const thumbnail = blog.images.length
                    ? `<img src="${blog.images[0]}" alt="${blog.title} image" class="blog-thumbnail">`
                    : "";

                row.innerHTML = `
                    <td>
                        <div class="blog-title-cell">
                            ${thumbnail}
                            <div>
                                <div class="blog-title">${blog.title}</div>
                                <div class="blog-date">${blog.date}</div>
                            </div>
                        </div>
                    </td>
                    <td>${blog.date}</td>
                    <td class="blog-short">${blog.shortDescription}</td>
                `;

                tableBody.appendChild(row);
            });
        }

        displayBlogs();
    </script>

</body>

</html>
